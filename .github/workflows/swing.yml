# Backtest SWING (19/10) : trades de plusieurs jours en bougies journalières, stop suiveur, funding Kraken réel.
# Lancé à la main (onglet Actions → swing → Run workflow) et chaque dimanche à 5 h UTC.
# Résultat : table Supabase backtest_runs (report.type = "swing"), jamais utilisé par le moteur intraday.
name: swing

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "jours d'historique journalier (365 à 2500)"
        default: "1500"
      instruments:
        description: "nombre de perpétuels crypto (3 à 80) ; + matières premières et actions"
        default: "40"
      etude:
        description: "true = étude seulement"
        default: "false"

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - run: pip install -e .
      - name: Backtest swing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
          DATA_DIR: data-swing
          FUTURES_ENABLED: "true"
          BACKTEST_DAYS: ${{ github.event.inputs.days || '1500' }}
          BACKTEST_INSTRUMENTS: ${{ github.event.inputs.instruments || '40' }}
          BACKTEST_ETUDE: ${{ github.event.inputs.etude || 'false' }}
          USER_AGENT: "loup-de-kraken/1.0 (private club bot)"
        run: python -m kraken_assistant.cloud.run swing_backtest
