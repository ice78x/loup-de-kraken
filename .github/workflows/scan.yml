# Le bot scanne le marché et met le site à jour.
# Horaire : toutes les 30 minutes, 24 h / 24 (à hh:05 et hh:35). GitHub peut retarder un lancement de quelques minutes.
# Dépôt PUBLIC depuis le 05/10 : minutes GitHub Actions illimitées (en privé, 48 scans/jour dépasseraient les 2 000 min gratuites).
# Le bouton "Scanner maintenant" du site déclenche aussi ce workflow.
name: scan

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal ou urgent"
        default: "normal"
      symbol:
        description: "vérification express d'une seule paire (ex. futures:PF_TAOUSD) ; vide = scan complet"
        default: ""

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - run: pip install -e .
      # Historique des bougies conservé d'une exécution à l'autre
      - uses: actions/cache@v4
        with:
          path: bot/data
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: Scan + envoi au site + suivi des trades
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
          TRANSLATE_EMAIL: ${{ secrets.TRANSLATE_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MODE: ${{ github.event.inputs.mode || 'normal' }}
          SCAN_SYMBOL: ${{ github.event.inputs.symbol || '' }}
          FUTURES_ENABLED: "true"
          USER_AGENT: "loup-de-kraken/1.0 (private club bot)"
        run: python -m kraken_assistant.cloud.run scan
