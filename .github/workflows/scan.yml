# Le bot scanne le marché et met le site à jour.
# Horaire : toutes les heures de 6 h à 23 h (heure de Paris en été ; 5 h à 22 h en hiver).
# ≈ 18 scans/jour ≈ 1 600 minutes/mois → reste dans les 2 000 minutes gratuites d'un dépôt privé.
# Le bouton "Scanner maintenant" du site déclenche aussi ce workflow.
name: scan

on:
  schedule:
    - cron: "5 4-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal ou urgent"
        default: "normal"

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - run: pip install -e .
      # Historique des bougies conservé d'une exécution à l'autre
      - uses: actions/cache@v4
        with:
          path: bot/data
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: Scan + envoi au site + suivi des trades
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCAN_MODE: ${{ github.event.inputs.mode || 'normal' }}
          FUTURES_ENABLED: "true"
          USER_AGENT: "loup-de-kraken/1.0 (private club bot)"
        run: python -m kraken_assistant.cloud.run scan
