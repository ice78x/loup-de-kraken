# Une fois par semaine (dimanche 3 h UTC), le bot rejoue ses stratégies sur tout l'historique accumulé
# et garde les réglages qui ont marché sur des périodes jamais vues pendant le réglage.
name: optimize

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: bot/data
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: Optimisation walk-forward
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPTIMIZER_MAX_BARS: "6000"
        run: python -m kraken_assistant.cloud.run optimize
