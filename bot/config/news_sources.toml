# Sources de news (RSS/Atom). tier : 1 officiel, 2 régulateur, 3 communiqué entreprise/protocole/exchange,
# 4 média financier reconnu, 5 média crypto reconnu.
# Une news de tier 1-3 est considérée "vérifiée" (source primaire).
# Une news de tier 4-5 n'est "vérifiée" que si au moins 2 sources indépendantes la rapportent.
# Les URLs peuvent évoluer : si une source échoue, elle est signalée dans STATUS (jamais remplacée par du contenu inventé).

[[source]]
name = "Federal Reserve"
url = "https://www.federalreserve.gov/feeds/press_all.xml"
tier = 1
scope = "macro"

